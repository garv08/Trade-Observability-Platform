[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-observability-platform"
version = "0.5.0"
description = "TOP - Trade Observability Platform: a local research desk for Indian markets (Nifty 50, all BSE stocks, ETFs, NSE/BSE indices) with DuckDB history, 152 studies, 92 backtestable strategies, a strategy leaderboard, portfolio backtests, market breadth and plain-language swing-trade readings."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.14"
authors = [{ name = "garv08" }]
keywords = ["nse", "nifty50", "backtesting", "technical-analysis", "harmonic-patterns", "duckdb", "trading"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Office/Business :: Financial :: Investment",
  "Intended Audience :: Financial and Insurance Industry",
]
# DuckDB is the only runtime dependency. 1.1.3 is pinned because it runs on
# older x86 CPUs without SSE4.2; newer DuckDB builds stop with "illegal instruction" there.
dependencies = ["duckdb==1.1.3"]

[project.scripts]
top-platform = "top.server:main"
top-sync = "top.store:main"
top-leaderboard = "top.leaderboard:main"

[project.urls]
Homepage = "https://github.com/garv08/Trade-Observability-Platform"
Documentation = "https://github.com/garv08/Trade-Observability-Platform/tree/main/docs"
Issues = "https://github.com/garv08/Trade-Observability-Platform/issues"

[tool.setuptools.packages.find]
include = ["top*"]

[tool.setuptools.package-data]
top = ["web/*.html", "web/*.js", "web/*.css", "web/vendor/*"]
